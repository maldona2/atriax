  <style>

      overflow: hidden;

    [id="02-intro-page"] {

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (() => {
      const $ = (id) => document.getElementById(id);
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["02-intro"] = tl;

      const letters = document.querySelectorAll('[class~="02-intro-l"]');
      const words = document.querySelectorAll('[class~="02-intro-w"]');
      const card = $("02-intro-card");
      const jitterEl = $("02-intro-jitter");

      /* Static 3D tilt owned by GSAP (not CSS) so the Scene-3 settle composes cleanly. */
      gsap.set(card, { transformPerspective: 1600, rotationY: -7, rotationX: 3 });

      /* ── Scene 1 (0.0–2.0s): "Atriax" staggered reveal + subline (dynamic-content-sequencing) ── */
      tl.fromTo(
        "[id='02-intro-accentline']",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.5, ease: "power3.out" },
        0.05,
      );
      tl.fromTo(
        letters,
        { y: 34, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.6, ease: "power3.out", stagger: 0.07 },
        0.15,
      );
      /* content-aware stagger: window scales with word count, never hardcoded per item */
      const wordStagger = Math.min(0.09, 0.6 / words.length);
      tl.fromTo(
        words,
        { y: 18, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power2.out", stagger: wordStagger },
        0.85,
      );

      /* ── Scene 2 (2.0–5.0s): landing rises as tilted 3D card, inner content scrolls (3d-page-scroll) ── */
      tl.fromTo(
        "[id='02-intro-cardwrap']",
        { y: 820 }, /* card top 330+820 = 1150 → fully below the 1080 canvas */
        { y: 0, duration: 1.4, ease: "power3.out" },
        2.0,
      );
      /* SCROLL_DISTANCE measured from layout: img 583px − viewport 397px = 186px.
         Starts showing the page bottom, settles on the site hero (top). */
      tl.fromTo(
        "[id='02-intro-page']",
        { y: -186 },
        { y: 0, duration: 1.5, ease: "power3.out" },
        3.3,
      );

      /* ── Scene 3 (5.0–8.0s): card settles flat + ambient glow bloom, one beat ── */
      tl.to(card, { rotationY: 0, rotationX: 0, duration: 0.9, ease: "power2.inOut" }, 5.0);
      tl.fromTo(
        "[id='02-intro-glow']",
        { opacity: 0, scale: 0.88 },
        { opacity: 0.12, scale: 1, duration: 0.9, ease: "power2.out" }, /* dark glow on white: well under the 0.45 ceiling */
        5.0,
      );

      /* HELD read: subtle jitter (sine-wave-loop, low amp) as the only life — bounded phase
         tween, sin(0)=0 at start, amplitude eased out over the last 25% so the cut lands still. */
      const CYCLES = 1;
      const phase = { p: 0 };
      tl.to(
        phase,
        {
          p: Math.PI * 2 * CYCLES,
          duration: 2.05,
          ease: "none",
          onUpdate: () => {
            const t = phase.p / (Math.PI * 2 * CYCLES);
            const env = t < 0.75 ? 1 : (1 - t) / 0.25;
            jitterEl.style.transform =
              "translateY(" + (Math.sin(phase.p) * 2.2 * env).toFixed(3) + "px)";
          },
        },
        5.95,
      );
    })();
  </script>
