    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // --- virtual camera: single wrapper, T = -offset × S ---
        const world = document.getElementById("pacientes05-world");
        const cam = { scale: 1, x: 0, y: 0 };
        const applyCamera = () => {
          world.style.transform =
            "translate(" + cam.x + "px, " + cam.y + "px) scale(" + cam.scale + ")";
        };
        applyCamera(); // seed frame 0

        // --- motion-blur streak (wrapper-level carve-out, inOut leg → seed 0) ---
        const blurNode = document.getElementById("pacientes05-streak-blur");
        const blur = { v: 0 };
        const writeBlur = () => blurNode.setAttribute("stdDeviation", blur.v + " 0");
        writeBlur();

        // seek-safe initial states (applied synchronously at build)
        gsap.set(["#pacientes05-eyebrow", "#pacientes05-title", "#pacientes05-listado"], {
          opacity: 0,
        });
        gsap.set("#pacientes05-line", { scaleX: 0, transformOrigin: "left center" });
        gsap.set("#pacientes05-ring", { scale: 0, transformOrigin: "50% 50%" });
        gsap.set(".pacientes05-callout", { opacity: 0 });

        // --- Scene 1 (0.0–2.5s): title + listado station, asymmetric 60/40 ---
        tl.fromTo(
          "#pacientes05-listado",
          { opacity: 0, y: 46 },
          { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" },
          0.1,
        );
        tl.fromTo(
          "#pacientes05-eyebrow",
          { opacity: 0, y: 22 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" },
          0.25,
        );
        tl.fromTo(
          "#pacientes05-title",
          { opacity: 0, y: 34 },
          { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" },
          0.4,
        );
        tl.to("#pacientes05-line", { scaleX: 1, duration: 0.5, ease: "power2.out" }, 0.7);

        // --- Scene 2 (2.5–4.5s): circle the row, camera focuses on it ---
        tl.fromTo(
          "#pacientes05-ring",
          { scale: 0, rotation: -2 },
          { scale: 1, rotation: -2, duration: 0.6, ease: "back.out(1.7)" },
          2.5,
        );
        tl.to(
          cam,
          { scale: 1.35, x: 465, y: 10, duration: 1.1, ease: "power3.inOut", onUpdate: applyCamera },
          2.65,
        );

        // diagonal swoop to the ficha station — blur peaks mid-leg, sharp at landing (~5.5s)
        tl.to(
          cam,
          {
            scale: 1,
            x: -1950,
            y: -180,
            duration: 1.3,
            ease: "power3.inOut",
            onUpdate: applyCamera,
          },
          4.2,
        );
        tl.to(blur, { v: 16, duration: 0.65, ease: "power3.in", onUpdate: writeBlur }, 4.2);
        tl.to(blur, { v: 0, duration: 0.65, ease: "power3.out", onUpdate: writeBlur }, 4.85);

        // --- Scene 3 (4.5–8.0s): landed — three callouts spring-pop in the back half ---
        tl.fromTo(
          "#pacientes05-c1",
          { opacity: 0, y: 18, scale: 0.85 },
          { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: "back.out(1.6)" },
          5.9,
        );
        tl.fromTo(
          "#pacientes05-c2",
          { opacity: 0, y: 18, scale: 0.85 },
          { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: "back.out(1.6)" },
          6.6,
        );
        tl.fromTo(
          "#pacientes05-c3",
          { opacity: 0, y: 18, scale: 0.85 },
          { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: "back.out(1.6)" },
          7.3,
        );

        // --- Scene 4 (8.0–10.0s): hold, settled ---

        window.__timelines["05-pacientes"] = tl;
      })();
